<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Remote Print Agent</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: 'Consolas', 'Courier New', monospace;
    background: #0d1117;
    color: #c9d1d9;
    max-width: 640px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .panel {
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 20px;
    background: #161b22;
  }
  h1 {
    font-size: 16px;
    letter-spacing: 2px;
    text-align: center;
    margin: 0 0 16px;
    border-bottom: 1px dashed #30363d;
    padding-bottom: 12px;
  }
  .row { display: flex; justify-content: space-between; padding: 6px 0; }
  .label { color: #8b949e; }
  .value { font-weight: bold; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.green { background: #3fb950; }
  .dot.red { background: #f85149; }
  .dot.gray { background: #6e7681; }
  h2 { font-size: 13px; color: #8b949e; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  .printer-list { list-style: none; margin: 0; padding: 0; }
  .printer-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #21262d;
    font-size: 13px;
  }
  .printer-list li:last-child { border-bottom: none; }
  .printer-list button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  button {
    flex: 1;
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #30363d; }
  #msg { margin-top: 12px; min-height: 20px; font-size: 13px; color: #58a6ff; }
  #logs {
    margin-top: 16px;
    background: #010409;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px;
    height: 220px;
    overflow-y: auto;
    font-size: 12px;
    white-space: pre-wrap;
    display: none;
  }
</style>
</head>
<body>
  <div class="panel">
    <h1>REMOTE PRINT AGENT</h1>
    <div class="row"><span class="label">Agent ID</span><span class="value" id="agentId">-</span></div>
    <div class="row"><span class="label">Cloud</span><span class="value"><span class="dot gray" id="backendDot"></span><span id="backendText">-</span></span></div>
    <div class="row"><span class="label">Last Check</span><span class="value" id="lastCheck">-</span></div>
    <div class="row"><span class="label">Last Job</span><span class="value" id="lastJob">-</span></div>
    <div class="row"><span class="label">Last Print</span><span class="value" id="lastPrint">-</span></div>
    <div class="row"><span class="label">Jobs Printed Today</span><span class="value" id="jobsToday">-</span></div>

    <h2>Detected Printers</h2>
    <ul class="printer-list" id="printerList"><li>Loading...</li></ul>

    <div class="actions">
      <button id="btnRefresh">Refresh</button>
      <button id="btnLogs">View Logs</button>
    </div>
    <div id="msg"></div>
    <pre id="logs"></pre>
  </div>

<script>
async function refreshStatus() {
  const res = await fetch('/api/status');
  const s = await res.json();
  document.getElementById('agentId').textContent = s.agentId || '(not set)';
  document.getElementById('backendDot').className = 'dot ' + (s.backendConnected ? 'green' : 'red');
  document.getElementById('backendText').textContent = s.backendConnected ? 'Connected' : 'Disconnected';
  document.getElementById('lastCheck').textContent = s.lastCheck ? new Date(s.lastCheck).toLocaleTimeString() : '-';
  document.getElementById('lastJob').textContent = s.lastJobId || '-';
  document.getElementById('lastPrint').textContent = s.lastPrintStatus || '-';
  document.getElementById('jobsToday').textContent = s.jobsPrintedToday;

  const list = document.getElementById('printerList');
  list.innerHTML = '';
  if (!s.printers || !s.printers.length) {
    list.innerHTML = '<li>No printers detected</li>';
    return;
  }
  s.printers.forEach((name) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = name;
    const btn = document.createElement('button');
    btn.textContent = 'Test Print';
    btn.addEventListener('click', () => testPrint(name));
    li.appendChild(span);
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function setMsg(text) {
  document.getElementById('msg').textContent = text;
}

async function testPrint(printerName) {
  setMsg(`Sending test page to "${printerName}"...`);
  const res = await fetch('/api/test-print', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ printerName }),
  });
  const data = await res.json();
  setMsg(data.success ? data.message : data.error);
  refreshStatus();
}

document.getElementById('btnRefresh').addEventListener('click', () => {
  setMsg('Refreshing...');
  refreshStatus().then(() => setMsg('Refreshed.'));
});

document.getElementById('btnLogs').addEventListener('click', async () => {
  const el = document.getElementById('logs');
  if (el.style.display === 'block') { el.style.display = 'none'; return; }
  const res = await fetch('/api/logs');
  const data = await res.json();
  el.textContent = data.logs.join('\n');
  el.style.display = 'block';
  el.scrollTop = el.scrollHeight;
});

refreshStatus();
setInterval(refreshStatus, 4000);
</script>
</body>
</html>
